<!doctype html>
<html lang="pt-BR">
<head>

  <style>
/* Molduras entalhadas, pedra violeta e metais em planos de cor sólidos. */
.skill-tree{--st-accent:#83c5d1;--st-region:#29455b;position:fixed;inset:0;z-index:9050;display:flex;flex-direction:column;box-sizing:border-box;padding:20px 26px 12px;background:#0e0e19;color:#d8d1c7;font:13px/1.5 'Courier New',monospace;border:6px solid #292332;box-shadow:inset 0 0 0 2px #76634d,inset 0 0 0 6px #12111b;color-scheme:dark;isolation:isolate}
.skill-tree[hidden]{display:none!important}
.skill-tree *{box-sizing:border-box}
.skill-tree::before,.skill-tree::after{content:'';position:absolute;pointer-events:none;width:14px;height:14px;background:#d0b783;border:4px solid #705744;top:0;left:0;box-shadow:2px 2px #080812}
.skill-tree::after{left:auto;right:0}
.skill-tree img{image-rendering:pixelated;image-rendering:crisp-edges}
.skill-tree button,.skill-tree input{font:inherit;border-radius:0}
.skill-tree button{color:#c3bba9;background:#201d2c;border:1px solid #554557;box-shadow:inset 0 1px #665460,2px 2px #080910;cursor:pointer;padding:8px 12px}
.skill-tree button:hover{color:#fff0c7;border-color:#b29b72;background:#302936}
.skill-tree button:focus-visible,.skill-tree input:focus-visible,.st-viewport:focus-visible{outline:2px solid #f3d6a0;outline-offset:4px}
.skill-tree button:disabled{cursor:default;color:#7e7b86;background:#1b1a25;border-color:#35303f;box-shadow:none}
.st-top{display:flex;align-items:center;gap:24px;min-height:80px;padding-bottom:16px;border-bottom:1px solid #66523f}
.st-brand{display:flex;align-items:center;gap:16px;flex:1}
.st-emblem{border:2px solid #8a7355;box-shadow:3px 3px #05050d}
.st-eyebrow{display:block;color:#9c8d78;font-size:10px;letter-spacing:1.8px;line-height:1.8}
.skill-tree h1{margin:2px 0 0;font:normal 28px/1.2 Georgia,serif;color:#f0dfbc;letter-spacing:1px}
.st-wallet{display:grid;grid-template-columns:auto auto;column-gap:18px;border-left:1px solid #514333;padding-left:24px}
.st-wallet>span{font-size:9px;letter-spacing:1.4px;color:#beaa7b}
.st-wallet strong{font-size:32px;line-height:1.2;color:#f2d69a;grid-column:2;grid-row:1/3}
.st-wallet small{font-size:10px;color:#a49a8f}
.skill-tree .st-back{font-size:11px;padding:10px 14px}
.st-regions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:14px 0}
.st-regions button{display:flex;align-items:center;justify-content:center;gap:12px;min-height:62px;text-align:left;background:#181722;border-color:#39313e;padding:8px}
.st-regions button[aria-pressed=true]{border-color:var(--tab-accent);background:#252331;box-shadow:inset 0 -3px var(--tab-accent),2px 2px #080910}
.st-regions img{opacity:.7}
.st-regions button[aria-pressed=true] img,.st-regions button:hover img{opacity:1}
.st-regions strong{display:block;color:var(--tab-accent);font-size:12px;letter-spacing:1.5px}
.st-regions small{display:block;font-size:8px;letter-spacing:1px;color:#9e94a0;margin-top:2px}
.st-workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:16px}
.st-map-panel{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;border:1px solid #554650;box-shadow:inset 0 0 0 3px #181421,3px 3px #070811;background:#11121d}
.st-map-title{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;gap:12px}
.st-map-title h2{margin:0;color:var(--st-accent);font:normal 23px/1.3 Georgia,serif;letter-spacing:5px}
.st-region-sub{font-size:8px;letter-spacing:1.2px}
.st-search-label{color:#8c8491;font-size:8px;letter-spacing:1px;display:flex;flex-direction:column;gap:3px;width:200px}
.st-search{width:100%;border:1px solid #49414b;padding:7px 10px;background:#0b0c15;color:#e5d7bb;font-size:11px!important;box-shadow:inset 2px 2px #06060e}
.st-search-results{position:absolute;z-index:5;right:20px;top:82px;width:min(430px,90%);max-height:320px;overflow:auto;border:2px solid #a89066;background:#171622;box-shadow:5px 5px #06060e;padding:12px}
.st-search-results small{display:block;margin-bottom:8px;color:#d1b87f}
.st-search-results button{display:block;width:100%;text-align:left;margin-top:5px;font-size:11px;line-height:1.6}
.st-branches{display:flex;gap:5px;padding:0 20px 13px;border-bottom:1px solid #352e3e;overflow-x:auto;flex-shrink:0}
.st-branches button{font-size:10px;white-space:nowrap;padding:6px 10px;color:#a39b9f;box-shadow:none;border:1px solid #38313f;background:#181722}
.st-branches button[aria-pressed=true]{color:#eee0c0;border-color:#97805d;background:#302938}
.st-map-tools{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#171620;gap:8px;min-height:36px}
.st-map-tools>div{display:flex;align-items:center;gap:5px}
.st-path-label{color:#81758a;font-size:8px;letter-spacing:1.5px}
.st-map-tools button{padding:2px 8px;font-size:12px;min-width:27px;box-shadow:none}
.st-map-tools .st-center{font-size:9px;padding:4px 8px;margin-left:5px}
.st-zoom{font-size:10px;width:36px;text-align:center;color:#b5a68c}
.st-viewport{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;position:relative;cursor:grab;scrollbar-color:#655064 #13111e;scrollbar-width:thin;background-color:#0e101b;background-image:radial-gradient(#3b3043 1px,transparent 1px),repeating-linear-gradient(0deg,transparent 0,transparent 63px,#191824 63px,#191824 64px),repeating-linear-gradient(90deg,transparent 0,transparent 63px,#191824 63px,#191824 64px);background-size:32px 32px,64px 64px,64px 64px}
.st-viewport.st-dragging{cursor:grabbing;user-select:none}
.st-world-size{position:relative;margin:0 auto;min-width:0}
.st-world{position:relative;transform-origin:0 0}
.st-world::before{content:'';position:absolute;left:245px;top:145px;width:320px;height:320px;border:2px solid #282132;box-shadow:0 0 0 10px #15121f,0 0 0 12px #24202e;clip-path:polygon(30% 0,70% 0,70% 12%,88% 12%,88% 30%,100% 30%,100% 70%,88% 70%,88% 88%,70% 88%,70% 100%,30% 100%,30% 88%,12% 88%,12% 70%,0 70%,0 30%,12% 30%,12% 12%,30% 12%);pointer-events:none}
.st-tier-labels{position:absolute;top:22px;left:30px;display:flex;width:880px;color:#7e7187;font-size:10px;letter-spacing:2px;text-align:center;pointer-events:none}
.st-tier-labels span{width:176px}
.st-connections{position:absolute;inset:0;pointer-events:none;overflow:visible}
.st-connections path{fill:none;stroke:#514158;stroke-width:2}
.st-connections path.st-wire-shadow{stroke:#070913;stroke-width:6}
.st-connections path[data-state=tomado]{stroke:#c5aa74;stroke-width:3}
.st-connections path[data-state=livre],.st-connections path.st-route{stroke:var(--st-accent);stroke-dasharray:5 5}
.skill-tree .st-node{position:absolute;width:96px;height:96px;padding:0;background:transparent;border:0;box-shadow:none;color:#b2aab7;isolation:isolate}
.st-node-frame{display:block;position:relative;width:96px;height:96px;background-image:var(--st-frame);image-rendering:pixelated;image-rendering:crisp-edges}
.st-icon{position:absolute;width:64px;height:64px;left:16px;top:16px}
.st-node-frame::after{content:'';position:absolute;inset:14px;border:2px solid #413649;pointer-events:none}
.st-node[data-state=tomado] .st-node-frame::after{border-color:#dab87a}
.st-node[data-state=livre] .st-node-frame::after{border-color:var(--st-accent)}
.st-node[data-state=trancado] .st-icon,.st-node[data-state=barrado] .st-icon{opacity:.78}
.skill-tree .st-node:hover{background:transparent;color:#f2e5c7}
.st-node[aria-pressed=true]::before{content:'';position:absolute;inset:-5px;border:2px solid #f0d49c;box-shadow:0 0 0 3px #100d1a}
.st-node[aria-pressed=true] .st-node-label{color:#ffe0a0}
.st-node-state{position:absolute;right:-1px;bottom:1px;min-width:20px;height:20px;font:16px/18px 'Courier New',monospace;color:#b8a2be;background:#18131e;border:1px solid #65516a}
.st-node[data-state=tomado] .st-node-state{color:#f3ce83;border-color:#b59c6b}
.st-node[data-state=livre] .st-node-state{color:var(--st-accent);border-color:var(--st-accent)}
.st-node-label{position:absolute;top:104px;left:50%;width:160px;transform:translateX(-50%);font-size:11px;line-height:1.35;text-align:center;font-weight:bold;letter-spacing:.5px;pointer-events:none}
.st-node-type{display:none}
.st-legend{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid #3e3245;background:#171520;font-size:9px;color:#a197a3}
.st-legend b{font-size:12px;margin-right:3px}
.st-legend b[data-state=tomado]{color:#e7c486}
.st-legend b[data-state=livre]{color:var(--st-accent)}
.st-legend span:last-child{margin-left:auto;color:#766b80}
.st-details{background:#191621;border:1px solid #7f6855;box-shadow:inset 0 0 0 3px #24202e,3px 3px #070810;padding:20px;overflow:auto;scrollbar-width:thin;scrollbar-color:#655064 #191621;min-height:0;position:relative}
.st-details>.st-eyebrow:first-child{font-size:8px;letter-spacing:1px;border-bottom:1px solid #4d3e47;padding-bottom:12px}
.st-detail-hero{display:flex;align-items:center;gap:10px;margin:20px 0}
.st-status{font-size:10px;color:#a996ad;border-bottom:1px solid #4e3d54;padding-bottom:5px}
.st-status[data-state=livre]{color:var(--st-accent)}
.st-status[data-state=tomado]{color:#e9c987}
.st-details h2{font:normal 22px/1.2 Georgia,serif;color:#f0dfba;margin:7px 0 15px;overflow-wrap:anywhere}
.st-details>.st-eyebrow{font-size:9px;letter-spacing:1px}
.st-description{font-size:12px;line-height:1.8;color:#b6a9b6;margin-bottom:18px}
.st-effect{border-left:2px solid var(--st-accent);padding:8px 10px;color:var(--st-accent);background:#11131d;font-size:11px}
.st-cost{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #453748;border-bottom:1px solid #453748;padding:12px 0;align-items:center}
.st-cost span{font-size:8px;color:#b09a7a;letter-spacing:1px}
.st-cost strong{color:#ebcb89;font-size:12px;white-space:nowrap}
.st-details h3{font-size:9px;letter-spacing:2px;color:#a19280;margin:20px 0 10px}
.st-requirements{list-style:none;padding:0;margin:0 0 16px}
.st-requirements li{display:flex;gap:8px;font-size:11px;line-height:1.6;margin:9px 0}
.st-requirements b{flex:none}.st-met{color:#acba97}.st-unmet{color:#b69aac}
.st-reason,.st-refund-note{font-size:10px;line-height:1.7;color:#d09da3}
.skill-tree .st-action{width:100%;padding:12px 10px;color:#ffebbe;background:#39303a;border:2px solid #b49969;box-shadow:inset 0 2px #d1b785,inset 0 -3px #211725,3px 3px #07080e;font-weight:bold;font-size:11px}
.skill-tree .st-action:hover:not(:disabled){background:#4d3b46;border-color:#f4d29c}
.skill-tree .st-cancel{width:100%;margin-top:10px;font-size:10px}
.st-flavor{font:italic 13px/1.7 Georgia,serif;color:#8f7e91;margin:22px 0 0;border-top:1px solid #403143;padding-top:18px}
.st-bottom{display:flex;justify-content:space-between;gap:12px;padding-top:12px;color:#817388;font-size:9px;min-height:27px}
.st-character{color:#c6b28b}.st-live{color:#d9c79f}
.st-manage{margin-top:20px;border-top:1px solid #403143;padding-top:12px;font-size:10px;color:#a697a5}
.st-manage summary{cursor:pointer;padding:5px 0;list-style-position:inside}
.st-budget{display:flex;gap:8px;align-items:center;margin:10px 0}.st-budget span{flex:1}
.skill-tree .st-budget button{padding:3px 8px}.skill-tree .st-reset{margin-top:10px;width:100%;font-size:10px}
/* A arte fica compacta; textos auxiliares continuam legíveis. */
.st-node-label{font-size:13px;letter-spacing:0}
.st-regions strong{font-size:13px}.st-regions small{font-size:9px}
.st-branches button{font-size:11px}.st-eyebrow{font-size:11px}
.st-details>.st-eyebrow:first-child{font-size:9px}.st-details>.st-eyebrow{font-size:10px}
.st-details h3{font-size:10px}.st-requirements li{font-size:12px}.st-description{font-size:13px}
.st-cost span{font-size:9px}.st-reason,.st-refund-note{font-size:11px}
.st-wallet>span{font-size:10px}.st-wallet small{font-size:11px}
.st-legend{font-size:10px}.st-path-label{font-size:9px}.st-search-label{font-size:9px}
.st-bottom{font-size:10px}.st-search{font-size:12px!important}
@media(min-width:1600px){.skill-tree{padding:26px 40px 16px}.st-workspace{grid-template-columns:minmax(0,1fr) 330px}.st-details{padding:24px}.st-top{min-height:94px}.st-regions{padding:18px 0}}
@media(max-width:1050px){.skill-tree{padding:14px 16px 10px}.st-top{gap:14px}.st-wallet{padding-left:12px;column-gap:10px}.skill-tree h1{font-size:24px}.st-brand>.st-emblem{display:none}.st-regions button{gap:7px}.st-regions strong{font-size:10px}.st-regions small{font-size:7px}.st-workspace{grid-template-columns:minmax(0,1fr) 250px;gap:10px}.st-details{padding:14px}.st-path-label{display:none}.st-map-tools{justify-content:flex-end}.st-details h2{font-size:20px}.st-map-title{padding:12px}.st-branches{padding:0 12px 10px}}
@media(max-width:720px){.skill-tree{padding:10px;inset:0;border-width:3px}.st-top{gap:8px;flex-wrap:wrap;min-height:60px;padding-bottom:10px}.skill-tree h1{font-size:21px}.st-brand{min-width:180px}.st-brand .st-eyebrow{font-size:7px;letter-spacing:1px}.st-wallet{border:0;padding:0;column-gap:8px}.st-wallet strong{font-size:24px}.st-wallet>span{font-size:7px}.st-wallet small{font-size:8px}.skill-tree .st-back{padding:5px 9px;font-size:9px}.st-regions{gap:4px;padding:8px 0;overflow-x:auto;display:flex;flex-shrink:0}.st-regions button{min-width:112px;min-height:45px;gap:6px;padding:5px}.st-regions img{width:28px;height:28px}.st-workspace{display:flex;flex-direction:column;gap:8px}.st-map-panel{flex:1;min-height:260px}.st-details{height:215px;flex:none;padding:14px}.st-detail-hero{float:left;margin:8px 14px 8px 0;display:block}.st-status{display:block;margin:5px 0}.st-details h2{margin-top:10px}.st-details>.st-eyebrow:first-child{padding-bottom:7px}.st-details .st-cost{clear:both}.st-description{font-size:11px}.st-map-title{padding:7px 10px}.st-map-title h2{font-size:18px}.st-region-sub{font-size:7px}.st-search-label{width:160px;font-size:7px}.st-search{font-size:10px!important;padding:5px 7px}.st-branches{padding:0 10px 7px}.st-branches button{font-size:8px;padding:4px 8px}.st-map-tools{padding:4px 8px;min-height:29px}.st-legend{font-size:8px;padding:5px 8px;gap:10px}.st-legend span:last-child{display:none}.st-bottom{padding-top:6px;font-size:8px;min-height:18px}.st-bottom>span:nth-child(2){display:none}}
@media(max-height:620px) and (min-width:721px){.skill-tree{padding:8px 14px}.st-top{min-height:52px;padding-bottom:8px}.st-regions{padding:8px 0}.st-regions button{min-height:46px}.st-map-title{padding:6px 14px}.st-branches{padding-bottom:7px}.st-bottom{padding-top:5px}}
@media(max-height:720px) and (max-width:720px){.st-map-panel{min-height:170px}.st-details{height:170px}.st-top .st-brand{min-width:160px}.skill-tree h1{font-size:18px}.st-regions button{min-height:38px}.st-regions img{width:24px;height:24px}}

/* A carta radial: órbita contínua, seis cores e um único olho no miolo. */
.skill-tree.st-radial{background:#09040e;border-color:#28102f;box-shadow:inset 0 0 0 2px #71336e,inset 0 0 0 5px #100717;padding:14px 20px 10px}
.st-radial::before,.st-radial::after{background:#eeb5e3;border-color:#75316d;width:10px;height:10px}
.st-radial .st-top{min-height:65px;padding-bottom:12px;border-color:#4b1d50}
.st-radial .st-emblem{display:none}
.st-radial h1{color:#efc3eb;font:normal 25px/1.3 'Courier New',monospace;letter-spacing:1px}
.st-radial .st-brand .st-eyebrow{color:#a471a6;letter-spacing:2px}
.st-radial .st-wallet{border-color:#482044}
.st-radial .st-wallet strong{color:#e6a4dc}
.st-radial .st-wallet>span{color:#c08abc}
.st-radial button{background:#190a21;border-color:#603061;box-shadow:inset 0 1px #793b77,2px 2px #030106;color:#d4a1d0}
.st-radial button:hover{border-color:#c27cbd;background:#2b1032;color:#ffdbfa}
.st-radial .st-workspace{padding-top:12px;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.st-radial .st-map-panel{border:2px solid #602661;background:#07030c;box-shadow:0 0 0 2px #200d2c,inset 0 0 0 3px #11091b}
.st-radial .st-map-title{padding:9px 16px;min-height:60px;border-bottom:1px solid #311237}
.st-radial .st-map-title h2{font:normal 18px/1.4 'Courier New',monospace;color:#c57cbe;letter-spacing:2px}
.st-radial .st-region-sub{color:#77567e;font-size:8px;letter-spacing:1px}
.st-radial .st-search{background:#0e0614;border-color:#45204d;color:#e6bade;box-shadow:inset 2px 2px #030106}
.st-radial .st-search-label{color:#966398}
.st-radial .st-search-results{top:64px;background:#17091e;border-color:#92518d}
.st-radial .st-map-tools{position:absolute;left:14px;bottom:46px;z-index:4;padding:6px;background:#100616;border:1px solid #572652;min-height:34px}
.st-radial .st-path-label{display:none}
.st-radial .st-map-tools button{font-size:10px;padding:6px 10px;box-shadow:none}
.st-radial .st-map-tools .st-center{font-size:10px;margin-left:8px}
.st-radial .st-zoom{font-size:10px;width:52px;color:#b686b9}
.st-radial .st-viewport{background:#05020a;scrollbar-color:#74376a #090411}
.st-radial .st-world-size{margin:6px auto}
.st-radial .st-world::before{display:none}
.st-orbit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.st-eye{position:absolute;width:384px;height:192px;pointer-events:none;user-select:none}
.st-eye svg{display:block;width:100%;height:100%}
/* A íris anda em passo inteiro; o deslize curto é só para o olhar não
   teletransportar de um canto ao outro quando o ponteiro salta. */
.st-eye-iris,.st-eye-glint{transform-box:view-box;transform-origin:0 0;transition:transform .12s linear}
/* A PISCADA é a pálpebra descendo, e não a figura achatada. Achatar em
   pixel art pula fileiras de pixel, e o olho encolhia em vez de fechar.
   Os passos são inteiros (steps) porque a borda que varre o olho é a
   curva da própria pálpebra, e ela só está certa em pixel cheio. */
.st-eye-lid,.st-eye-lash{transform-box:view-box;transform-origin:0 0;animation:st-eye-blink 7.5s steps(1,end) infinite}
@keyframes st-eye-blink{
  0%,95.2%,100%{transform:translateY(0)}
  95.4%{transform:translateY(16px)}
  95.7%{transform:translateY(34px)}
  96.0%,96.7%{transform:translateY(50px)}
  97.0%{transform:translateY(34px)}
  97.4%{transform:translateY(16px)}
}
@media(prefers-reduced-motion:reduce){.st-eye-lid,.st-eye-lash{animation:none}.st-eye-iris,.st-eye-glint{transition:none}}
.st-radial .st-connections path{stroke:#392820;stroke-width:5;stroke-dasharray:none;stroke-linecap:square}
.st-radial .st-connections path[data-state=tomado]{stroke:var(--wire-bright);stroke-width:7}
.st-radial .st-connections path[data-state=livre]{stroke:var(--wire-color);stroke-dasharray:12 12}
.st-radial .st-connections path.st-route{stroke:var(--wire-bright);stroke-dasharray:12 12}
.st-radial .st-node{border-radius:50%;z-index:2}
.st-radial .st-node-frame{transform-origin:0 0}
.st-radial .st-node .st-node-frame::after{display:none}
.st-radial .st-node .st-icon{clip-path:polygon(27% 0,73% 0,73% 5%,86% 5%,86% 14%,95% 14%,95% 27%,100% 27%,100% 73%,95% 73%,95% 86%,86% 86%,86% 95%,73% 95%,73% 100%,27% 100%,27% 95%,14% 95%,14% 86%,5% 86%,5% 73%,0 73%,0 27%,5% 27%,5% 14%,14% 14%,14% 5%,27% 5%)}

/* PixelKit — pixel art painted by code.

   material it is made of and how lit it is. Light is applied afterwards by

   night pushes the whole room down and toward blue. The result is always one
   of the ramp's colours: no alpha blending, no soft gradients, and ordered

/* A ficha de "O Céu tem Fome" — o modelo, sem desenho nenhum.

   Cinco atributos de 0 a 7, comprados com 4 pontos sobre uma base de 1 cada
   (deixar um atributo em 0 devolve o ponto da base — é assim que o jogador
   "pega 1 ponto" sacrificando uma parte de si). O pico é 7.

     TAUMATURGIA · a arte de realizar milagres — e o preço deles
     COSMO       · inteligência e percepção
     SENSO       · carisma e vontade
     SUBSTÂNCIA  · destreza e vigor
     MÁQUINA     · força e constituição

   Resolução em d20: cada ponto do atributo tira 1 da dificuldade do teste.
   A dificuldade base é do mestre (padrão 14: atributo 0 acerta 35%, atributo
   7 acerta 70% — ninguém fica seguro, ninguém fica inútil). O resultado é
   sorteado AQUI, inteiro, antes de qualquer animação: a animação é
   apresentação, não mecânica, e por isso pode ser pulada sem trapaça.

   VITALIDADE nasce de SUBSTÂNCIA (o vigor) e conversa com o sistema de
   saúde por região do corpo: a ficha não duplica o corpo, ela o resume.

   SANIDADE é uma vela de 6 pontos. Quando apaga, o personagem não morre:
   ganha uma MARCA permanente, o teto da vela cai 1 para sempre e ela

(function (root) {

    ['csm', 'COSMO', 'CSM', 'INTELIGÊNCIA E PERCEPÇÃO', 'agua'],
    ['sns', 'SENSO', 'SNS', 'CARISMA E VONTADE', 'vermelho'],
    ['sbt', 'SUBSTÂNCIA', 'SBT', 'DESTREZA E VIGOR', 'folha'],

    }
    remover(id = this.atual()?.id) {
      if (this.fichas.length <= 1) return false;
      const i = this.fichas.findIndex(f => f.id === id);
      if (i < 0) return false;
      const eraEmCena = this.fichas[i].emCena;
      this.fichas.splice(i, 1);
      this.ativa = Math.min(this.ativa > i ? this.ativa - 1 : this.ativa, this.fichas.length - 1);
      if (eraEmCena) this.fichas[0].emCena = true;
      this.mudou('remover');
      return true;
    }
    selecionar(i) {
      const n = this.fichas.length;
      this.ativa = ((Math.round(i) % n) + n) % n;
      this.mudou('folhear');
      return this.atual();
    }
    folhear(d) { return this.selecionar(this.ativa + (d < 0 ? -1 : 1)); }
    porEmCena(id = this.atual()?.id) {
      for (const f of this.fichas) f.emCena = f.id === id;
      this.mudou('emcena');
    }
    /* Uma ficha que chegou de fora (do jogador) entra ou atualiza a que já
       existe com o mesmo id — é assim que o código colado vira ficha. */
    receber(dados) {
      const f = validar(dados, this.fichas.length + 1);
      f.emCena = false;
      const i = this.fichas.findIndex(x => x.id === f.id);
      if (i >= 0) { f.emCena = this.fichas[i].emCena; this.fichas[i] = f; this.ativa = i; this.mudou('receber'); return {ficha: f, novo: false}; }
      if (this.fichas.length >= FICHAS_MAX) return null;
      this.fichas.push(f);
      this.ativa = this.fichas.length - 1;
      this.mudou('receber');
      return {ficha: f, novo: true};
    }

    /* -------------------------------------------------------------- escrita */
    limiteDe(campo) { return TEXTO[campo] || 0; }
    escrever(campo, valor, id = this.atual()?.id) {
      const f = this.de(id);
      if (!f || !(campo in TEXTO)) return false;
      f[campo] = texto(valor, TEXTO[campo]);
      this.mudou('escrever');
      return true;
    }
    nomeVisivel(f = this.atual()) { return (f?.personagem || '').trim() || 'SEM NOME'; }

    /* ----------------------------------------------------------- atributos */
    valorDe(atr, id = this.atual()?.id) { const f = this.de(id); return f ? inteiro(f.atributos[atr] ?? 0, 0, ATR_MAX) : 0; }
    /* Base 1 em cada um; o que passa disso é ponto gasto, o que falta para 1
       é ponto devolvido. Por isso zerar um atributo devolve exatamente 1. */
    gastos(id = this.atual()?.id) {
      const f = this.de(id);
      if (!f) return 0;
      return ATRIBUTOS.reduce((n, [a]) => n + (f.atributos[a] ?? 0), 0) - ATR_BASE * ATRIBUTOS.length;
    }
    pontosRestantes(id) { return PONTOS - this.gastos(id); }
    get pontosTotais() { return PONTOS; }
    podeSubir(atr, id) { return this.valorDe(atr, id) < ATR_MAX && this.pontosRestantes(id) > 0; }
    podeDescer(atr, id) { return this.valorDe(atr, id) > 0; }
    definirAtributo(atr, valor, id = this.atual()?.id) {
      const f = this.de(id);
      if (!f || !this.atributo(atr)) return 0;
      const alvo = inteiro(valor, 0, ATR_MAX), antes = f.atributos[atr];
      f.atributos[atr] = alvo;
      if (this.gastos(id) > PONTOS) { f.atributos[atr] = antes; return antes; }  // sem saldo, nada muda
      this.mudou('atributo');
      return alvo;
    }
    ajustarAtributo(atr, d, id) { return this.definirAtributo(atr, this.valorDe(atr, id) + d, id); }
    /* Tudo de volta à base, saldo cheio. */
    zerarPontos(id = this.atual()?.id) {
      const f = this.de(id);
      if (!f) return;
      for (const [a] of ATRIBUTOS) f.atributos[a] = ATR_BASE;
      this.mudou('atributo');
    }

    /* ------------------------------------------------------------ perícias */
    grauDe(p, id = this.atual()?.id) { const f = this.de(id); return f ? inteiro(f.pericias[p] ?? 0, 0, GRAU_MAX) : 0; }
    definirGrau(p, g, id = this.atual()?.id) {
      const f = this.de(id);
      if (!f || !this.pericia(p)) return 0;
      const v = inteiro(g, 0, GRAU_MAX);
      if (v > 0) f.pericias[p] = v; else delete f.pericias[p];
      this.mudou('pericia');
      return v;
    }
    cicloPericia(p, id) { return this.definirGrau(p, (this.grauDe(p, id) + 1) % (GRAU_MAX + 1), id); }
    treinadas(id = this.atual()?.id) { const f = this.de(id); return f ? Object.keys(f.pericias).length : 0; }

    /* Árvore de perícias: um ponto por grau, três graus independentes por
       perícia. Os identificadores grau:<pericia>:<nivel> continuam estáveis. */
    get pontosPericiaBase() { return this.ppBase; }
    set pontosPericiaBase(v) { this.ppBase = inteiro(v, PP_MIN, PP_MAX); this.mudou('config'); }
    get grafo() { return GRAFO; }
    get tiposDeNodulo() { return DADOS ? DADOS.TIPOS : []; }
    get regioesDaArvore() { return DADOS ? DADOS.REGIOES : []; }
    nodulo(no) { return GRAFO.porId.get(no) || null; }
    /* O nódulo de um grau, e o grau de um nódulo: a ponte entre a página
       de perícias (que fala em grau) e a árvore (que fala em nódulo). */
    noDoGrau(p, n) { return `grau:${p}:${inteiro(n, 1, GRAU_MAX)}`; }

    tomado(no, id = this.atual()?.id) {
      const n = GRAFO.porId.get(no);
      if (!n) return false;
      if (n.tipo === 'grau') return this.grauDe(n.pericia, id) >= n.nivel;
      const f = this.de(id);
      return !!f && Array.isArray(f.arvore) && f.arvore.indexOf(no) >= 0;
    }
    tomados(id = this.atual()?.id) {
      const fora = new Set();
      for (const n of GRAFO.nos) if (this.tomado(n.id, id)) fora.add(n.id);
      return fora;
    }
    gastoArvore(id = this.atual()?.id) {
      let n = 0;
      for (const no of GRAFO.nos) if (this.tomado(no.id, id)) n += no.custo;
      return n;
    }
    pontosArvore(id) { return Math.max(0, this.ppBase - this.gastoArvore(id)); }
    gastoNaRegiao(reg, id = this.atual()?.id) {
      let n = 0;
      for (const no of GRAFO.nos)
        if (no.regiao === reg && this.tomado(no.id, id)) n += no.custo;
      return n;
    }
    /* Quanto foi investido FORA de um Arquétipo. É o requisito que
       obriga a Queda a ter passaporte: ninguém desanda um princípio
       inteiro sem ter atravessado o mundo pelo menos uma vez. */
    gastoFora(reg, id = this.atual()?.id) {
      let n = 0;
      for (const no of GRAFO.nos)
        if (no.regiao !== reg && this.tomado(no.id, id)) n += no.custo;
      return n;
    }

    /* A LISTA DE REQUISITOS, que é o coração da interface: cada linha sabe
       se passou, o que pede e quanto falta. Nódulo trancado que não diz o
       motivo é só um botão apagado. */
    requisitosDe(no, id = this.atual()?.id) {
      const n = GRAFO.porId.get(no);
      if (!n) return [];
      const fora = [];
      const R = n.req || {};
      if (n.de.length) {
        const pais = n.de.map(p => GRAFO.porId.get(p)).filter(Boolean);
        const tem = pais.filter(p => this.tomado(p.id, id));
        const todos = n.modo === 'todos';
        fora.push({tipo: 'de', ok: todos ? tem.length === pais.length : tem.length > 0,
          txt: pais.length === 1 ? pais[0].nome
            : (todos ? pais.map(p => p.nome).join(' e ') : pais.map(p => p.nome).join(' ou ')),
          rotulo: pais.length === 1 ? 'Vem de' : (todos ? 'Vem de todos' : 'Vem de um destes')});
      }
      for (const a in (R.atr || {})) {
        const alvo = R.atr[a], tenho = this.valorDe(a, id), nome = (this.atributo(a) || [, a])[1];
        fora.push({tipo: 'atr', ok: tenho >= alvo, rotulo: 'Atributo',
          txt: `${nome} ${alvo}`, tenho, alvo});
      }
      for (const r in (R.gasto || {})) {
        const alvo = R.gasto[r], tenho = this.gastoNaRegiao(r, id);
        const nome = (DADOS.REGIOES.find(x => x[0] === r) || [, r])[1];
        fora.push({tipo: 'gasto', ok: tenho >= alvo, rotulo: 'Investido',
          txt: `${alvo} em ${nome}`, tenho, alvo});
      }
      if (R.fora) {
        const tenho = this.gastoFora(n.regiao, id);
        const nome = (DADOS.REGIOES.find(x => x[0] === n.regiao) || [, n.regiao])[1];
        fora.push({tipo: 'fora', ok: tenho >= R.fora, rotulo: 'E fora',
          txt: `${R.fora} fora de ${nome}`, tenho, alvo: R.fora});
      }
      for (const p in (R.grau || {})) {
        const alvo = R.grau[p], tenho = this.grauDe(p, id);
        const nome = (this.pericia(p) || [, p])[1];
        fora.push({tipo: 'grau', ok: tenho >= alvo, rotulo: 'Treino',
          txt: `${nome} ${'I'.repeat(alvo)}`, tenho, alvo});
      }
      /* As exclusões viram UMA linha só quando são muitas. Uma Queda
         fecha as outras cinco, e cinco linhas dizendo "Fecha" empurrariam
         o requisito que realmente falta para fora do painel — e o
         requisito que falta é a única informação que muda a decisão. */
      const barras = (R.sem || []).map(b => GRAFO.porId.get(b)).filter(Boolean);
      const tomadas = barras.filter(o => this.tomado(o.id, id));
      if (barras.length === 1)
        fora.push({tipo: 'sem', ok: !tomadas.length, rotulo: 'Fecha', txt: barras[0].nome});
      else if (barras.length > 1)
        fora.push({tipo: 'sem', ok: !tomadas.length, rotulo: tomadas.length ? 'Fechada por' : 'Fecha',
          txt: tomadas.length ? tomadas.map(o => o.nome).join(', ')
            : `as outras ${barras.length}`, barras: barras.map(o => o.id)});
      return fora;
    }
    /* O estado de um nódulo, nas quatro palavras que o desenho conhece. */
    estadoDe(no, id = this.atual()?.id) {
      if (!this.nodulo(no)) return 'trancado';
      if (this.tomado(no, id)) return 'tomado';
      const reqs = this.requisitosDe(no, id);
      if (reqs.some(r => r.tipo === 'sem' && !r.ok)) return 'barrado';
      return reqs.every(r => r.ok) && this.pontosArvore(id) >= (this.nodulo(no)?.custo || 1)
        ? 'livre' : 'trancado';
    }
    /* Por que está trancado — a primeira linha que falhou, para quem só
       tem espaço para uma frase. `null` quer dizer que dá para pegar. */
    motivoDe(no, id = this.atual()?.id) {
      if (!this.nodulo(no)) return 'perícia inexistente';
      if (this.tomado(no, id)) return null;
      const falha = this.requisitosDe(no, id).find(r => !r.ok);
      if (falha) return falha.tipo === 'sem' ? `fechado por ${falha.txt}` : `falta ${falha.txt}`;
      if (this.pontosArvore(id) < (this.nodulo(no)?.custo || 1)) return 'sem pontos';
      return null;
    }
    podeComprar(no, id) { return this.estadoDe(no, id) === 'livre'; }
    comprar(no, id = this.atual()?.id) {
      if (!this.podeComprar(no, id)) return false;
      const n = GRAFO.porId.get(no), f = this.de(id);
      if (!n || !f) return false;
      if (n.tipo === 'grau') { this.definirGrau(n.pericia, n.nivel, id); return true; }
      if (!Array.isArray(f.arvore)) f.arvore = [];
      f.arvore.push(no);
      this.mudou('pericia');
      return true;
    }
    /* Quem cairia junto se este nódulo saísse. Grim Dawn trava e não
       explica, e é a reclamação mais repetida sobre o sistema dele: aqui a
       cascata é mostrada ANTES de confirmar. */
    dependentesDe(no, id = this.atual()?.id) {
      const n = this.nodulo(no);
      if (!n || !this.tomado(no, id)) return [];
      return GRAFO.nos.filter(o => o.pericia === n.pericia && o.nivel > n.nivel && this.tomado(o.id, id)).map(o => o.id);
    }
    /* O requisito de um nódulo contra um conjunto de tomados hipotético.
       É o mesmo teste de `requisitosDe`, sem o custo e sem o texto. */
    valeCom(n, tomados, id) {
      const R = n.req || {};
      if (n.de.length) {
        const pais = n.de.filter(p => GRAFO.porId.has(p));
        const tem = pais.filter(p => tomados.has(p));
        if (n.modo === 'todos' ? tem.length < pais.length : tem.length === 0) return false;
      }
      for (const a in (R.atr || {})) if (this.valorDe(a, id) < R.atr[a]) return false;
      for (const p in (R.grau || {})) if (this.grauDe(p, id) < R.grau[p]) return false;
      for (const barra of (R.sem || [])) if (tomados.has(barra)) return false;
      for (const r in (R.gasto || {})) {
        let n2 = 0;
        for (const o of GRAFO.nos) if (o.regiao === r && tomados.has(o.id)) n2 += o.custo;
        if (n2 < R.gasto[r]) return false;
      }
      if (R.fora) {
        let n2 = 0;
        for (const o of GRAFO.nos) if (o.regiao !== n.regiao && tomados.has(o.id)) n2 += o.custo;
        if (n2 < R.fora) return false;
      }
      return true;
    }
    /* Devolver leva junto quem dependia. Nada de travar sem explicar: quem
       chama recebe a lista do que caiu. */
    devolver(no, id = this.atual()?.id) {
      if (!this.tomado(no, id)) return null;
      const junto = this.dependentesDe(no, id);
      for (const q of [no, ...junto]) this.soltar(q, id);
      this.mudou('pericia');
      return junto;
    }
    soltar(no, id) {
      const n = GRAFO.porId.get(no), f = this.de(id);
      if (!n || !f) return;
      if (n.tipo === 'grau') {
        const g = this.grauDe(n.pericia, id);
        if (g >= n.nivel) {
          const v = n.nivel - 1;
          if (v > 0) f.pericias[n.pericia] = v; else delete f.pericias[n.pericia];
        }
        return;
      }
      if (Array.isArray(f.arvore)) f.arvore = f.arvore.filter(x => x !== no);
    }
    /* O caminho mais barato até um nódulo ainda trancado, contando só o
       que falta comprar. É o que a tela realça antes de a pessoa gastar. */
    caminhoAte(no, id = this.atual()?.id) {
      const alvo = GRAFO.porId.get(no);
      if (!alvo || this.tomado(no, id)) return [];
      const visto = new Map();
      const anda = q => {
        if (visto.has(q)) return visto.get(q);
        visto.set(q, null);                      // corta ciclo
        const n = GRAFO.porId.get(q);
        if (!n) return null;
        if (this.tomado(q, id)) { visto.set(q, []); return []; }
        let melhor = [];
        if (n.de.length) {
          const rotas = n.de.map(p => anda(p)).filter(Boolean);
          if (!rotas.length) { visto.set(q, null); return null; }
          melhor = n.modo === 'todos'
            ? [...new Set(rotas.flat())]
            : rotas.reduce((a, b) => (a.length <= b.length ? a : b));
        }
        const rota = [...melhor, q];
        visto.set(q, rota);
        return rota;
      };
      const cadeia = anda(no);
      if (!cadeia) return null;
      /* O caminho não é só a corrente de pais: um nódulo que pede GASTO
         numa região também precisa desse gasto acontecer. Sem isto o
         painel prometia "custa 3 pontos" para um nódulo que na verdade
         custava oito, e promessa de preço errada é pior que nenhuma. */
      return this.completarGasto(cadeia, no, id);
    }
    completarGasto(cadeia, no, id) {
      const alvo = GRAFO.porId.get(no);
      const pede = (alvo && alvo.req && alvo.req.gasto) || null;
      const foraPede = (alvo && alvo.req && alvo.req.fora) || 0;
      if (!pede && !foraPede) return cadeia;
      const rota = cadeia.slice();
      /* O alvo fica FORA do conjunto enquanto se procura o que falta: ele
         ainda não foi comprado, e contá-lo faria o gasto que ele mesmo
         exige parecer já satisfeito — e faria a rota escolher um nódulo
         que só abriria depois dele. */
      const set = new Set([...this.tomados(id), ...rota]);
      set.delete(no);
      /* O próprio alvo não conta para o gasto que ele exige: quando ele
         for comprado, o requisito já vai ter sido conferido sem ele. */
      const gastoEm = reg => GRAFO.nos.reduce((n, o) =>
        n + (o.regiao === reg && o.id !== no && set.has(o.id) ? o.custo : 0), 0);
      for (const reg in (pede || {})) {
        let voltas = 0;
        while (gastoEm(reg) < pede[reg] && voltas++ < 60) {
          /* O mais barato que dá para pegar agora naquela região, e entre
             os empatados o que estiver mais perto do começo do catálogo:
             assim a rota é a mesma toda vez que se olha para ela. */
          const cand = GRAFO.nos.filter(o => o.regiao === reg && !set.has(o.id) &&
            o.id !== no && this.valeCom(o, set, id));
          if (!cand.length) break;
          cand.sort((a, b) => a.custo - b.custo);
          set.add(cand[0].id); rota.splice(rota.length - 1, 0, cand[0].id);
        }
      }
      /* E o que tem que ser investido FORA do Arquétipo. É o que faz o
         painel prometer o preço certo de uma Queda: sem isto ele dizia
         "custa 8" para um nódulo que custava doze. */
      if (foraPede) {
        const foraDe = () => GRAFO.nos.reduce((n, o) =>
          n + (o.regiao !== alvo.regiao && o.id !== no && set.has(o.id) ? o.custo : 0), 0);
        let voltas = 0;
        while (foraDe() < foraPede && voltas++ < 60) {
          const cand = GRAFO.nos.filter(o => o.regiao !== alvo.regiao && !set.has(o.id) &&
            o.id !== no && this.valeCom(o, set, id));
          if (!cand.length) break;
          cand.sort((a, b) => a.custo - b.custo);
          set.add(cand[0].id); rota.splice(rota.length - 1, 0, cand[0].id);
        }
      }
      return rota;
    }
    zerarArvore(id = this.atual()?.id) {
      const f = this.de(id);
      if (!f) return false;
      f.pericias = {}; f.arvore = [];
      this.mudou('pericia');
      return true;
    }

    /* ----------------------------------------------- compatibilidade
       A página de perícias continua falando em perícia e grau. Estas
       quatro conversam com ela sem que ela precise saber de nódulo. */
    gastoPericias(id) { return this.gastoArvore(id); }
    pontosPericia(id) { return this.pontosArvore(id); }
    travaDe(p, nivel, id = this.atual()?.id) {
      const n = inteiro(nivel, 1, GRAU_MAX);
      if (n <= this.grauDe(p, id)) return null;
      return this.motivoDe(this.noDoGrau(p, n), id) || null;
    }
    proximoNodulo(p, id = this.atual()?.id) {
      const g = this.grauDe(p, id);
      return g < GRAU_MAX && this.podeComprar(this.noDoGrau(p, g + 1), id) ? g + 1 : 0;
    }
    destravar(p, id = this.atual()?.id) {
      const g = this.grauDe(p, id);
      return g < GRAU_MAX && this.comprar(this.noDoGrau(p, g + 1), id);
    }
    zerarPericias(id) { return this.zerarArvore(id); }

    /* Baixar um atributo pode deixar nódulo pendurado no que o tronco já
       não aguenta. Em vez de proibir, a árvore PODA: derruba o que ficou
       sem requisito, em cascata, e devolve quantos pontos voltaram. */
    podar(id = this.atual()?.id) {
      const f = this.de(id);
      if (!f) return 0;
      let podados = 0, mexeu = true;
      while (mexeu) {
        mexeu = false;
        const agora = this.tomados(id);
        for (const n of GRAFO.nos) {
          if (!agora.has(n.id)) continue;
          if (this.valeCom(n, agora, id)) continue;
          this.soltar(n.id, id); podados += n.custo; mexeu = true;
        }
      }
      if (podados) this.mudou('pericia');
      return podados;
    }
    /* ----------------------------------------------------------- vitalidade */
    /* O vigor mora em SUBSTÂNCIA: é ele que diz quanta vida o corpo tem. */
    vitalidadeMax(id) { return 10 + this.valorDe('sbt', id) * 2; }
    /* A saúde do jogo é percentual por região; aqui ela vira um número de
       ficha sem deixar de ser o mesmo corpo. */
    vitalidade(saude, id) {
      const max = this.vitalidadeMax(id);
      const pct = saude && Number.isFinite(saude.vitality) ? saude.vitality : 100;
      return {max, atual: Math.max(0, Math.round(max * Math.max(0, Math.min(100, pct)) / 100)), pct};
    }
    /* O quanto cada região do corpo aguenta a mais por causa do vigor:
       SBT 0 → 70% do normal, SBT 7 → 140%. Quem aplica é a ponte do jogo. */
    resistenciaDoCorpo(id) { return .7 + this.valorDe('sbt', id) * .1; }

    /* -------------------------------------------------------------- vela */
    tetoVela(id = this.atual()?.id) { const f = this.de(id); return f ? Math.max(1, VELA_MAX - f.marcas.length) : VELA_MAX; }
    vela(id = this.atual()?.id) { const f = this.de(id); return f ? inteiro(f.vela, 0, this.tetoVela(id)) : 0; }
    get velaMax() { return VELA_MAX; }
    /* Quatro estágios de chama: alta, média, bruxuleando, fumaça. */
    estagioDaChama(id) {
      const teto = this.tetoVela(id), v = this.vela(id);
      if (v <= 0) return 3;
